name: Skill stack CI

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact candidate SHA checked by the trusted main workflow definition
        required: false
        type: string
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: skill-stack-ci-${{ inputs.target_sha || github.ref }}
  cancel-in-progress: true

jobs:
  mark-dispatched-target:
    name: Mark trusted-main CI target pending
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Publish pending exact-target status
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.target_sha != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "target_sha must be a full SHA" >&2; exit 1; }
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            -f state=pending \
            -f context="Skill stack CI (trusted main)" \
            -f description="Trusted main workflow is validating ${TARGET_SHA:0:12}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

  validate:
    name: Validate skill stack
    needs: mark-dispatched-target
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target_sha || github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pinned test runner
        run: python -m pip install --disable-pip-version-check pytest==9.1.1

      - name: Syntax check scripts
        run: |
          node --check scripts/theangry-skills.mjs
          node --check scripts/sync-curated-mirrors.mjs
          node --check scripts/sync-hyperframes-mirror.mjs

      - name: Validate mirror invariants
        run: |
          node scripts/sync-curated-mirrors.mjs --check
          node scripts/sync-hyperframes-mirror.mjs --check
          python scripts/sync-matt-adaptations.py --check

      - name: Run tests
        run: python -m pytest -q tests

      - name: Validate shared skill catalog
        run: scripts/theangry-skills.mjs check --root skills --profile shared

      - name: Report skill safety signals
        run: |
          scripts/theangry-skills.mjs security scan-root skills --json > /tmp/theangryskills-security-scan.json || true
          node <<'NODE'
          const fs = require("node:fs");
          const report = JSON.parse(fs.readFileSync("/tmp/theangryskills-security-scan.json", "utf8"));
          const summary = report.summary || {};
          const blocking = Number(summary.blocking_skill_count || 0);
          const review = Number(summary.review_skill_count || 0);
          console.log(`security_verdict=${report.verdict}`);
          console.log(`blocking_skill_count=${blocking}`);
          console.log(`review_skill_count=${review}`);
          fs.appendFileSync(
            process.env.GITHUB_STEP_SUMMARY,
            `## Skill safety signals\n\n- Verdict: ${report.verdict}\n- Blocking signals: ${blocking}\n- Review signals: ${review}\n\nThese signals are informational for one-to-one upstream mirrors and do not block deterministic mirror synchronization.\n`
          );
          NODE

  attest-dispatched-target:
    name: Record trusted-main CI result on dispatched target
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.target_sha != '' }}
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Publish exact-target result
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ inputs.target_sha }}
          VALIDATION_RESULT: ${{ needs.validate.result }}
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "target_sha must be a full SHA" >&2; exit 1; }
          state=failure
          if [ "$VALIDATION_RESULT" = success ]; then
            state=success
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            -f state="$state" \
            -f context="Skill stack CI (trusted main)" \
            -f description="Trusted main workflow validated ${TARGET_SHA:0:12}: ${VALIDATION_RESULT}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          [ "$state" = success ]
