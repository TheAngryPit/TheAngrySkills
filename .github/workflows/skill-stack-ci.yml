name: Skill stack CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: skill-stack-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate skill stack
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pinned test runner
        run: python -m pip install --disable-pip-version-check pytest==9.1.1

      - name: Syntax check scripts
        run: |
          node --check scripts/theangry-skills.mjs
          node --check scripts/sync-curated-mirrors.mjs
          node --check scripts/sync-hyperframes-mirror.mjs

      - name: Validate mirror invariants
        run: |
          node scripts/sync-curated-mirrors.mjs --check
          node scripts/sync-hyperframes-mirror.mjs --check

      - name: Run tests
        run: python -m pytest -q tests

      - name: Validate shared skill catalog
        run: scripts/theangry-skills.mjs check --root skills --profile shared

      - name: Report skill safety signals
        run: |
          scripts/theangry-skills.mjs security scan-root skills --json > /tmp/theangryskills-security-scan.json || true
          node <<'NODE'
          const fs = require("node:fs");
          const report = JSON.parse(fs.readFileSync("/tmp/theangryskills-security-scan.json", "utf8"));
          const summary = report.summary || {};
          const blocking = Number(summary.blocking_skill_count || 0);
          const review = Number(summary.review_skill_count || 0);
          console.log(`security_verdict=${report.verdict}`);
          console.log(`blocking_skill_count=${blocking}`);
          console.log(`review_skill_count=${review}`);
          fs.appendFileSync(
            process.env.GITHUB_STEP_SUMMARY,
            `## Skill safety signals\n\n- Verdict: ${report.verdict}\n- Blocking signals: ${blocking}\n- Review signals: ${review}\n\nThese signals are informational for one-to-one upstream mirrors and do not block deterministic mirror synchronization.\n`
          );
          NODE
