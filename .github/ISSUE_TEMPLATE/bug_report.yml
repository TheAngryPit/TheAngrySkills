name: Broken skill or install path
description: Report a skill, install, update, mirror, or catalog problem.
title: "[bug] "
labels: ["needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What broke?
      description: Name the skill, command, category, or mirror involved.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Include the exact command, install scope, and output.
      placeholder: |
        1. Run `npx skills add ...`
        2. Select ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, agent target, install scope, and relevant versions. Do not paste secrets.
    validations:
      required: false

